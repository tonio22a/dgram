{% extends "base.html" %}

{% block title %}Стена{% endblock %}

{% block content %}
<div class="faq">
    <div class="faq-header">Стена класса</div>
    <div class="faq-content">
        
        <form method="POST">
            <input name="text" placeholder="Что нового?" required style="width: 80%; padding: 8px;">
            <button type="submit">Отправить</button>
        </form>
        
        <hr style="margin: 20px 0;">
        
        {% for msg in messages %}
        <div class="post" style="border-bottom: 1px solid #eee; padding: 10px 0;">
            <b style="color: #1a73e8;">{{ msg[0] }}</b>
            <span style="color: #999; font-size: 12px;">{{ msg[2] }}</span>
            <p style="margin-top: 5px;">{{ msg[1] }}</p>
        </div>
        {% endfor %}
        
    </div>
</div>
{% endblock %}
